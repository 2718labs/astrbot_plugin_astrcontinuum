[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[project]
name = "astrbot-plugin-astrcontinuum"
version = "0.1.0"
description = "Non-blocking infinite context runtime for AstrBot"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "2718labs"}]
dependencies = [
    "cryptography>=42",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "PyYAML>=6",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/2718labs/astrbot_plugin_astrcontinuum"
Issues = "https://github.com/2718labs/astrbot_plugin_astrcontinuum/issues"
Repository = "https://github.com/2718labs/astrbot_plugin_astrcontinuum"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["*.md"]
line-length = 100
target-version = "py310"

[tool.uv.build-backend]
module-name = "astrcontinuum"
module-root = ""
