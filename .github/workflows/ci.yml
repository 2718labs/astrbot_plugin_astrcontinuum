name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --frozen --extra dev

      - name: Validate public metadata and configuration
        run: |
          uv run python -m json.tool _conf_schema.json > /dev/null
          uv run python -c "from pathlib import Path; import yaml; data=yaml.safe_load(Path('metadata.yaml').read_text(encoding='utf-8')); assert data['version'] == 'v0.2.0'; assert data['repo'] == 'https://github.com/2718labs/astrbot_plugin_astrcontinuum'"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff formatting
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy astrcontinuum main.py

      - name: Test
        run: uv run pytest -q
